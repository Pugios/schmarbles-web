<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#14121f">
    <!-- Added to the home screen, the game opens full screen with no browser bars (iPhone and Android). -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Schmarbles">
    <title>Schmarbles</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="TemplateData/icon.png">
    <link rel="apple-touch-icon" href="TemplateData/icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="loading">
      <img src="TemplateData/icon.png" alt="">
      <div class="bar"><div class="fill"></div></div>
    </div>

    <!-- Phone: the first tap goes full screen and turns the game sideways (where the browser allows it). -->
    <div id="tap-to-play" class="overlay">
      <div class="play"></div>
      <h1>TAP TO PLAY</h1>
    </div>

    <!-- Phone held upright where the browser cannot turn the game itself: ask the player to turn it. -->
    <div id="rotate" class="overlay">
      <div class="phone"></div>
      <h1>TURN YOUR PHONE</h1>
      <p>Schmarbles is played sideways.</p>
    </div>

    <div id="fullscreen-button" title="Full screen"></div>
    <div id="unity-warning"></div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var tapToPlay = document.querySelector("#tap-to-play");
      var rotate = document.querySelector("#rotate");
      var fullscreenButton = document.querySelector("#fullscreen-button");

      // A phone or tablet (iPads say they are Macs, but have a touch screen).
      var isPhone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
        || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

      // Started from the home screen: already full screen, nothing to ask for.
      var isInstalled = window.matchMedia("(display-mode: fullscreen)").matches
        || window.matchMedia("(display-mode: standalone)").matches
        || navigator.standalone === true;

      var root = document.documentElement;
      var canFullscreen = !!(root.requestFullscreen || root.webkitRequestFullscreen)
        && (document.fullscreenEnabled || document.webkitFullscreenEnabled);

      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function isPortrait() {
        return window.innerHeight > window.innerWidth;
      }

      // Turn the game sideways. Only works in full screen, and only where the browser supports it (Android
      // Chrome, Samsung Internet, Firefox; not Safari on an iPhone): everywhere else "turn your phone" shows.
      function lockLandscape() {
        try {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(function () {}).then(update);
          }
        } catch (e) {}
      }

      // Browsers only allow full screen right after a tap or click, so this runs from one.
      function enterFullscreen() {
        if (isFullscreen()) { lockLandscape(); return; }
        try {
          var request = root.requestFullscreen || root.webkitRequestFullscreen;
          var result = request.call(root, { navigationUI: "hide" });
          if (result && result.then) result.then(lockLandscape).catch(function () {}).then(update);
          else setTimeout(lockLandscape, 100);
        } catch (e) {}
      }

      function update() {
        var wantsTap = isPhone && !isInstalled && canFullscreen && !isFullscreen();
        tapToPlay.classList.toggle("shown", wantsTap);
        rotate.classList.toggle("shown", isPhone && !wantsTap && isPortrait());
        fullscreenButton.style.display = !isPhone && canFullscreen && !isFullscreen() ? "block" : "none";
        if (!wantsTap) canvas.focus();
      }

      tapToPlay.addEventListener("click", function (e) {
        e.preventDefault();
        enterFullscreen();
        // If the browser refuses, let the player in anyway.
        setTimeout(function () { if (!isFullscreen()) { canFullscreen = false; update(); } }, 600);
      });
      fullscreenButton.addEventListener("click", enterFullscreen);

      window.addEventListener("resize", update);
      window.addEventListener("orientationchange", function () { setTimeout(update, 200); });
      document.addEventListener("fullscreenchange", update);
      document.addEventListener("webkitfullscreenchange", update);
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      // Stop double-tap zoom and page scrolling on iOS, which ignores user-scalable=no.
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

      update();

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style = "padding: 10px; background: " + (type == "error" ? "red" : "yellow") + ";";
        banner.appendChild(div);
        banner.style.display = "block";
        if (type != "error") {
          setTimeout(function () {
            banner.removeChild(div);
            banner.style.display = banner.children.length ? "block" : "none";
          }, 5000);
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Schmarbles",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#loading .fill").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
          update();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
